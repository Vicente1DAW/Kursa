name: Backend CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, develop, hotfix]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, develop, hotfix]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend-deploy:
    needs: backend-checks
    if: >-
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hotfix') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.ENABLE_PRODUCTION_DEPLOYMENTS == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Push database schema to Neon Production
        run: node scripts/push-schema.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy to Render
        run: curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
